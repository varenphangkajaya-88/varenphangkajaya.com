backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "journal"
    label: "Journal"
    label_singular: "Article"
    folder: "journals"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{year}}"
    sortable_fields: ['date', 'title']
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Headline of the article" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "Short tagline shown on journal list (1-2 sentences)" }
      - { label: "Cover Photo (4:5 ratio recommended)", name: "cover", widget: "image", required: false, hint: "Shown on journal list grid" }
      - { label: "Hero Photo (16:9 ratio recommended)", name: "hero", widget: "image", required: false, hint: "Shown at top of article page" }
      - { label: "Body", name: "body", widget: "markdown", hint: "Use ** for bold, * for italic, 1. for numbered lists" }
      - label: "Pair Photos (optional)"
        name: "pair_photos"
        widget: "object"
        required: false
        collapsed: true
        hint: "Two photos side-by-side, shown in middle of article. Leave empty if not needed."
        fields:
          - { label: "Left Photo (4:5 ratio)", name: "left", widget: "image", required: false }
          - { label: "Right Photo (4:5 ratio)", name: "right", widget: "image", required: false }

  - name: "homepage"
    label: "Homepage"
    files:
      - label: "Homepage Cells"
        name: "homepage"
        file: "_data/homepage.json"
        fields:
          - label: "Creative Track — Hero Photo"
            name: "creative_hero"
            widget: "image"
            required: false
            hint: "Full bleed background for Creative Direction cell on homepage"
          - label: "Shopify Track — Hero Photo"
            name: "shopify_hero"
            widget: "image"
            required: false
            hint: "Full bleed background for Shopify & CRM cell on homepage"
          - label: "Systems Track — Hero Photo"
            name: "systems_hero"
            widget: "image"
            required: false
            hint: "Full bleed background for Systems & Web App cell on homepage"

  - name: "creative"
    label: "Creative Direction"
    files:
      - label: "Campaign Production"
        name: "campaigns"
        file: "_data/campaigns.json"
        fields:
          - { label: "Cover Photo", name: "cover", widget: "image", required: false }
          - { label: "Description", name: "description", widget: "text" }
          - label: "Campaign Photos"
            name: "photos"
            widget: "list"
            fields:
              - { label: "Photo", name: "photo", widget: "image" }
              - { label: "Campaign Name", name: "name", widget: "string" }
              - { label: "Year", name: "year", widget: "string" }

      - label: "Brand Activation & Pop Up"
        name: "activation"
        file: "_data/activation.json"
        fields:
          - { label: "Cover Photo", name: "cover", widget: "image", required: false }
          - { label: "Description", name: "description", widget: "text" }
          - label: "Hertape Laundry — Photos"
            name: "laundry_photos"
            widget: "list"
            fields:
              - { label: "Photo", name: "photo", widget: "image" }
          - label: "Her Airlines — Photos"
            name: "airlines_photos"
            widget: "list"
            fields:
              - { label: "Photo", name: "photo", widget: "image" }
