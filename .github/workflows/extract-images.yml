name: Extract Base64 Images

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run extraction script
        run: python3 extract_images.py

      - name: Replace index.html with clean version
        run: |
          if [ -f index-clean.html ]; then
            cp index.html index-backup-base64.html
            mv index-clean.html index.html
            echo "Replaced index.html with clean version"
          else
            echo "index-clean.html not found"
            exit 1
          fi

      - name: Show file sizes
        run: |
          ls -lh index.html index-backup-base64.html
          echo "Total images:"
          ls images/ | wc -l

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html images/ index-backup-base64.html
          git commit -m "Extract base64 images to separate files"
          git push
