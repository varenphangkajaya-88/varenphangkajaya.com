name: Rename Images

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run rename script
        run: python3 rename_images.py

      - name: Show final images folder
        run: |
          echo "=== Final images/ folder ==="
          ls -lh images/
          echo ""
          echo "Total images:"
          ls images/ | wc -l

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Rename hash images to clean names"
          git push
