name: Setup Dynamic Journal

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Backup current index.html
        run: cp index.html index-backup-pre-cms.html

      - name: Convert HTML to dynamic journal
        run: python3 convert_to_dynamic_journal.py

      - name: Show diff size
        run: |
          echo "=== File sizes ==="
          ls -lh index.html index-backup-pre-cms.html
          echo ""
          echo "=== Files in repo ==="
          ls -la *.js *.html 2>/dev/null || true

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html index-backup-pre-cms.html
          git diff --staged --quiet || git commit -m "Convert journal to dynamic CMS-driven version"
          git push
